<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>누끼 + 픽셀아트 변환기</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1e2128;
    --border: #30343d;
    --accent: #6ee7b7;
    --text: #e8e9ec;
    --muted: #9aa0aa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .wrap { width: 100%; max-width: 920px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.desc { color: var(--muted); margin: 0 0 24px; font-size: 13px; }

  .drop {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 32px;
    text-align: center;
    color: var(--muted);
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .drop.drag { border-color: var(--accent); background: #1a2b24; }
  .drop input { display: none; }

  .grid {
    display: grid;
    grid-template-columns: 1fr 260px;
    gap: 20px;
    margin-top: 20px;
  }
  @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }

  .canvas-box {
    background:
      linear-gradient(45deg, #2a2d34 25%, transparent 25%) 0 0/20px 20px,
      linear-gradient(-45deg, #2a2d34 25%, transparent 25%) 0 0/20px 20px,
      linear-gradient(45deg, transparent 75%, #2a2d34 75%) 0 0/20px 20px,
      linear-gradient(-45deg, transparent 75%, #2a2d34 75%) 0 0/20px 20px;
    background-color: #16181d;
    border-radius: 12px;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 320px;
    overflow: hidden;
  }
  canvas#output { max-width: 100%; max-height: 480px; image-rendering: pixelated; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    font-size: 13px;
  }
  .panel h3 { margin: 0 0 -4px; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
  label { display: flex; flex-direction: column; gap: 4px; }
  label span.val { color: var(--accent); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .row { display: flex; gap: 10px; }
  .chk { flex-direction: row; align-items: center; gap: 6px; }
  button {
    background: var(--accent);
    color: #0a0f0c;
    border: none;
    border-radius: 8px;
    padding: 10px 14px;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
  }
  button.secondary { background: #2a2e37; color: var(--text); }
  button:disabled { opacity: .5; cursor: default; }
  button:hover:not(:disabled) { filter: brightness(1.08); }

  .status { font-size: 12px; color: var(--muted); min-height: 16px; }
  progress { width: 100%; height: 6px; accent-color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>누끼 + 픽셀아트 변환기</h1>
  <p class="desc">사진을 올리면 배경을 제거하고, 각도·반전·확대·패턴 재배치·색조 등으로 원본과 다르게 변형한 뒤 픽셀화해서 투명 배경 PNG로 저장합니다. 모든 처리는 브라우저 안에서만 이루어지고 서버로 전송되지 않습니다.</p>

  <div class="drop" id="drop">
    <div id="dropLabel">이미지를 드래그하거나 클릭해서 선택하세요</div>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <div class="status" id="status"></div>
  <progress id="progress" style="display:none" max="100" value="0"></progress>

  <div class="grid">
    <div class="canvas-box">
      <canvas id="output" width="400" height="400"></canvas>
    </div>

    <div class="panel">
      <h3>변형 (원본과 다르게)</h3>
      <label>회전 <span class="val" id="rotVal">0°</span>
        <input type="range" id="rotation" min="-45" max="45" value="12" step="1">
      </label>
      <label>확대/크롭 <span class="val" id="zoomVal">1.10x</span>
        <input type="range" id="zoom" min="100" max="160" value="110" step="1">
      </label>
      <div class="row">
        <label class="chk"><input type="checkbox" id="flipH" checked> 좌우 반전</label>
        <label class="chk"><input type="checkbox" id="flipV"> 상하 반전</label>
      </div>
      <label>토핑/패턴 재배치 <span class="val" id="shuffleVal">6</span>
        <input type="range" id="shuffle" min="0" max="20" value="6" step="1">
      </label>
      <label>색조 변화 <span class="val" id="hueVal">15°</span>
        <input type="range" id="hue" min="-60" max="60" value="15" step="1">
      </label>
      <button class="secondary" id="randomize">🎲 랜덤 변형</button>

      <h3>픽셀화</h3>
      <label>픽셀 크기 <span class="val" id="pixelVal">10</span>
        <input type="range" id="pixelSize" min="2" max="40" value="10" step="1">
      </label>

      <button id="download" disabled>PNG로 저장</button>
    </div>
  </div>
</div>

<script>
const dropEl = document.getElementById('drop');
const fileInput = document.getElementById('fileInput');
const statusEl = document.getElementById('status');
const progressEl = document.getElementById('progress');
const outputCanvas = document.getElementById('output');
const octx = outputCanvas.getContext('2d');
const downloadBtn = document.getElementById('download');

const rotationEl = document.getElementById('rotation');
const zoomEl = document.getElementById('zoom');
const flipHEl = document.getElementById('flipH');
const flipVEl = document.getElementById('flipV');
const shuffleEl = document.getElementById('shuffle');
const hueEl = document.getElementById('hue');
const pixelSizeEl = document.getElementById('pixelSize');
const rotVal = document.getElementById('rotVal');
const zoomVal = document.getElementById('zoomVal');
const shuffleVal = document.getElementById('shuffleVal');
const hueVal = document.getElementById('hueVal');
const pixelVal = document.getElementById('pixelVal');

let cutoutImage = null; // 배경 제거된 canvas
let transformersLib = null;
let bgSegmenter = null;
// BiRefNet 계열(MIT)은 고품질이지만 브라우저 WASM 메모리 한도를 넘어 bad_alloc 오류가 났고,
// 커뮤니티가 올린 경량 모델(U-2-Netp)은 최신 라이브러리와 전처리 방식이 맞지 않아 오류가 남.
// 허깅페이스가 공식적으로 검증한 모델 중 라이선스가 깨끗(Apache-2.0)하고 가벼워서 안정적으로 도는 modnet으로 대체함.
// 인물 사진용으로 학습된 모델이라 음식 사진에서는 배경 제거 정확도가 BiRefNet보다 떨어질 수 있음.
const MODEL_ID = 'Xenova/modnet';
const MAX_DIM = 1400;

[rotationEl, zoomEl, flipHEl, flipVEl, shuffleEl, hueEl, pixelSizeEl].forEach(el =>
  el.addEventListener('input', render)
);

document.getElementById('randomize').addEventListener('click', () => {
  const dir = Math.random() < 0.5 ? -1 : 1;
  rotationEl.value = Math.round((10 + Math.random() * 30) * dir);
  zoomEl.value = Math.round(105 + Math.random() * 40);
  flipHEl.checked = Math.random() < 0.5;
  flipVEl.checked = Math.random() < 0.15;
  shuffleEl.value = Math.round(Math.random() * 14);
  hueEl.value = Math.round((10 + Math.random() * 40) * (Math.random() < 0.5 ? -1 : 1));
  render();
});

dropEl.addEventListener('click', () => fileInput.click());
dropEl.addEventListener('dragover', e => { e.preventDefault(); dropEl.classList.add('drag'); });
dropEl.addEventListener('dragleave', () => dropEl.classList.remove('drag'));
dropEl.addEventListener('drop', e => {
  e.preventDefault();
  dropEl.classList.remove('drag');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) handleFile(fileInput.files[0]);
});

async function loadLibrary() {
  if (transformersLib) return transformersLib;
  setStatus('라이브러리를 불러오는 중...');
  transformersLib = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0');
  return transformersLib;
}

function setStatus(msg) { statusEl.textContent = msg; }

async function handleFile(file) {
  downloadBtn.disabled = true;
  cutoutImage = null;
  try {
    const resizedBlob = await resizeIfNeeded(file);
    const { pipeline, env } = await loadLibrary();
    env.backends.onnx.wasm.proxy = false;

    if (!bgSegmenter) {
      progressEl.style.display = 'block';
      progressEl.removeAttribute('value');
      setStatus('배경 제거 모델을 다운로드하는 중... (최초 1회)');
      bgSegmenter = await pipeline('background-removal', MODEL_ID, { dtype: 'fp32' });
    }

    setStatus('배경 제거 중...');
    const objectUrl = URL.createObjectURL(resizedBlob);
    const result = await bgSegmenter(objectUrl);
    const canvas = result[0].toCanvas();

    cutoutImage = canvas;
    outputCanvas.width = canvas.width;
    outputCanvas.height = canvas.height;

    progressEl.style.display = 'none';
    setStatus('배경 제거 완료. 오른쪽에서 변형과 픽셀 크기를 조절하세요.');
    downloadBtn.disabled = false;
    render();
  } catch (err) {
    progressEl.style.display = 'none';
    setStatus('오류가 발생했습니다: ' + err.message);
    console.error(err);
    bgSegmenter = null; // 실패한 세션을 캐시해두지 않고 다음 시도 때 새로 만들도록 함
  }
}

function resizeIfNeeded(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, MAX_DIM / Math.max(img.width, img.height));
      if (scale >= 1) { resolve(file); return; }
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => resolve(b), file.type || 'image/png');
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

function render() {
  if (!cutoutImage) return;

  const angleDeg = Number(rotationEl.value);
  const zoom = Number(zoomEl.value) / 100;
  const flipH = flipHEl.checked;
  const flipV = flipVEl.checked;
  const patchCount = Number(shuffleEl.value);
  const hueDeg = Number(hueEl.value);
  const pixelSize = Number(pixelSizeEl.value);

  rotVal.textContent = angleDeg + '°';
  zoomVal.textContent = zoom.toFixed(2) + 'x';
  shuffleVal.textContent = patchCount;
  hueVal.textContent = hueDeg + '°';
  pixelVal.textContent = pixelSize;

  const colorShifted = applyColorShift(cutoutImage, hueDeg);
  const shuffled = shuffleContent(colorShifted, patchCount);
  const transformed = applyTransform(shuffled, angleDeg, flipH, flipV, zoom);
  const pixelated = pixelate(transformed, pixelSize);

  outputCanvas.width = pixelated.width;
  outputCanvas.height = pixelated.height;
  octx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);
  octx.imageSmoothingEnabled = false;
  octx.drawImage(pixelated, 0, 0);
}

function applyColorShift(sourceCanvas, hueDeg) {
  const w = sourceCanvas.width, h = sourceCanvas.height;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.filter = `hue-rotate(${hueDeg}deg) saturate(115%)`;
  ctx.drawImage(sourceCanvas, 0, 0);
  return c;
}

// 토핑/무늬처럼 보이는 영역을 임의로 복제·이동시켜 개수·배치가 원본과 다르게 보이도록 함
// (특정 사물을 인식해서 세는 것이 아니라, 사각 패치를 무작위로 복제하는 방식)
function shuffleContent(sourceCanvas, patchCount) {
  if (patchCount <= 0) return sourceCanvas;
  const w = sourceCanvas.width, h = sourceCanvas.height;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.drawImage(sourceCanvas, 0, 0);

  const patchSize = Math.max(10, Math.round(Math.min(w, h) * 0.08));
  for (let i = 0; i < patchCount; i++) {
    const sx = Math.random() * Math.max(1, w - patchSize);
    const sy = Math.random() * Math.max(1, h - patchSize);
    const dx = Math.random() * Math.max(1, w - patchSize);
    const dy = Math.random() * Math.max(1, h - patchSize);
    ctx.save();
    ctx.globalCompositeOperation = 'source-atop'; // 기존 실루엣(알파) 안에서만 덮어써서 배경으로 번지지 않게 함
    ctx.drawImage(c, sx, sy, patchSize, patchSize, dx, dy, patchSize, patchSize);
    ctx.restore();
  }
  return c;
}

function applyTransform(img, angleDeg, flipH, flipV, zoom) {
  const angle = angleDeg * Math.PI / 180;
  const w = img.width, h = img.height;
  const bw = Math.abs(w * Math.cos(angle)) + Math.abs(h * Math.sin(angle));
  const bh = Math.abs(w * Math.sin(angle)) + Math.abs(h * Math.cos(angle));

  const c = document.createElement('canvas');
  c.width = Math.round(bw);
  c.height = Math.round(bh);
  const ctx = c.getContext('2d');
  ctx.translate(c.width / 2, c.height / 2);
  ctx.rotate(angle);
  ctx.scale(flipH ? -1 : 1, flipV ? -1 : 1);
  ctx.scale(zoom, zoom);
  ctx.drawImage(img, -w / 2, -h / 2);
  return c;
}

function pixelate(sourceCanvas, pixelSize) {
  const w = sourceCanvas.width, h = sourceCanvas.height;
  const smallW = Math.max(1, Math.round(w / pixelSize));
  const smallH = Math.max(1, Math.round(h / pixelSize));

  const tmp = document.createElement('canvas');
  tmp.width = smallW; tmp.height = smallH;
  const tctx = tmp.getContext('2d');
  tctx.imageSmoothingEnabled = false;
  tctx.drawImage(sourceCanvas, 0, 0, smallW, smallH);

  const out = document.createElement('canvas');
  out.width = w; out.height = h;
  const octx2 = out.getContext('2d');
  octx2.imageSmoothingEnabled = false;
  octx2.drawImage(tmp, 0, 0, smallW, smallH, 0, 0, w, h);
  return out;
}

downloadBtn.addEventListener('click', () => {
  outputCanvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'pixel-nukki.png';
    a.click();
  }, 'image/png');
});
</script>
</body>
</html>
